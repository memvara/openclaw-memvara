name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          ver=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          test "$tag" = "$ver"

      - name: Zip plugin
        run: zip -r plugin.zip index.js openclaw.plugin.json package.json skills README.md LICENSE skill.lock

      - uses: softprops/action-gh-release@v2
        with:
          files: plugin.zip
          generate_release_notes: true
